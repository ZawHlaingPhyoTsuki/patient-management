services:
  # --- KAFKA ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"   # Internal (for other containers)
      - "9094:9094"   # External (for your host machine/IDE tools)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - internal

  # --- PATIENT DB ---
  patient-service-db:
    image: postgres:17
    container_name: patient-service-db
    ports:
      - "5000:5432"
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - /home/tsukuyomi/Desktop/db_volumes/patient-service-db:/var/lib/postgresql/data
    networks:
      - internal

  # --- BILLING SERVICE ---
  billing-service:
    build: ./billing-service
    container_name: billing-service
    ports:
      - "4001:4001" # HTTP/REST Port
      - "9001:9001" # gRPC Port
    environment:
      SERVER_PORT: 4001
      GRPC_SERVER_PORT: 9001
    depends_on:
      - kafka
    networks:
      - internal

  # --- PATIENT SERVICE ---
  patient-service:
    build: ./patient-service
    container_name: patient-service
    ports:
      - "4000:4000"
    environment:
      # DB Connection (Using internal Docker hostname)
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password

      # Kafka Connection (Using internal Docker hostname)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # gRPC Client Config
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

      # App Config
      SERVER_PORT: 4000
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    depends_on:
      - patient-service-db
      - kafka
      - billing-service
    networks:
      - internal

networks:
  internal:
    driver: bridge